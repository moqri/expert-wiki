name: Check for new papers
on:
  schedule: [{cron: "0 9 * * 1"}]   # Mondays 09:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python3 tools/check_new_papers.py && python3 tools/build_experts.py
      - name: Open a pull request if anything changed
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git diff --quiet && exit 0
          b="new-papers-$(date +%Y-%m-%d)"
          git config user.name "expert.wiki bot"; git config user.email "actions@github.com"
          git switch -c "$b" && git add -A && git commit -m "Queue new papers for expert confirmation" && git push -u origin "$b"
          gh pr create --title "New papers to confirm ($(date +%Y-%m-%d))" --body "New PubMed papers queued in experts/*/pending.json. Experts confirm them under Claim this page."
