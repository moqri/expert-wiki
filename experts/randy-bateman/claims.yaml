  figure_label: not faster production, marks late-onset Alzheimer's
  statement: Measuring amyloid-β turnover directly in the brain showed that people with common late-onset Alzheimer's clear both Aβ42 and Aβ40 more slowly than cognitively normal people, while production rates did not differ on average.
  paper: pmid-21148344
  evidence: Stable isotope labeling study in people with Alzheimer's and controls
  tags: [Amyloid production and clearance]
