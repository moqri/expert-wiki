  figure_label: accuracy of a blood %p-tau217 test for brain amyloid in people with memory problems
  statement: A mass spectrometry blood test for %p-tau217 classified amyloid PET status as well as FDA-approved spinal fluid tests (AUC 0.95–0.97 for both) and was generally better at detecting tau tangles. Using two cut-offs raised accuracy to 95%.
  paper: pmid-38382645
  evidence: Two cohorts, 1,422 people in Sweden and 337 in the US, with PET as the reference
  tags: [Blood tests]
- rank: 3
