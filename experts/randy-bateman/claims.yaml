  statement: In the DIAN-TU trial, neither antibody slowed cognitive decline after 4–7 years of treatment. Gantenerumab did clear amyloid plaques and lowered spinal fluid tau and p-tau181, while solanezumab showed no downstream biomarker benefit. Brain swelling (ARIA-E) occurred in 19.2% on gantenerumab.
