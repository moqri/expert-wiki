  statement: In an open-label extension of the DIAN-TU trial, three years of high-dose gantenerumab strongly reduced amyloid plaques. Partial or short-term amyloid removal showed no clear clinical effect, but long-term full removal potentially delayed symptom onset (hazard ratio 0.53, 95% CI 0.27–1.03); this needs confirming in longer controlled trials. Amyloid-related imaging abnormalities occurred in 53% of participants.
