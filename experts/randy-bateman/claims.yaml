  figure_label: before expected symptoms, spinal fluid amyloid-β starts to fall in inherited Alzheimer's
  statement: In families with an Alzheimer's-causing gene, amyloid-β in spinal fluid began to decline about 25 years before expected symptom onset. Amyloid plaques on PET, rising tau and brain shrinkage appeared about 15 years before, memory problems about 10 years before, and dementia about 3 years after.
  paper: pmid-22784036
  evidence: Prospective DIAN cohort, 128 people from families with inherited Alzheimer's
  tags: [Inherited Alzheimer's]
