headline: Measures how the brain makes and clears the proteins behind Alzheimer's disease, turns that into blood tests, and runs prevention trials in families with inherited Alzheimer's.
summary:
  - "Bateman's work began with a method to watch Alzheimer's proteins being made and cleared inside the living human brain. Volunteers receive a labeled amino acid, and spinal fluid is sampled over hours to time how quickly amyloid-β and later tau are produced and removed. With it, Bateman's group found that the common late-onset form of Alzheimer's is marked by slower clearance of amyloid-β rather than overproduction, that amyloid-β turnover slows with age, and that inherited presenilin mutations shift production toward the stickier Aβ42 form."
  - "Families who carry an Alzheimer's-causing gene develop symptoms at a fairly predictable age. Through the Dominantly Inherited Alzheimer Network (DIAN), Bateman's group used that to lay out the order of changes in the brain: spinal fluid amyloid-β starts to fall about 25 years before expected symptoms, amyloid plaques and tau changes follow about 15 years before, and memory problems about 10 years before."
  - "The same mass spectrometry work produced blood tests. Bateman's group showed that plasma amyloid-β 42/40 and especially plasma %p-tau217 detect brain amyloid with accuracy matching FDA-approved spinal fluid tests, that a newer tau fragment (MTBR-tau243) tracks tau tangles specifically, and that p-tau217 'clocks' can estimate when symptoms will begin to within about three to four years."
  - "Bateman leads the DIAN Trials Unit, a platform trial testing drugs to delay or prevent inherited Alzheimer's. Its first arms showed that gantenerumab cleared amyloid plaques while solanezumab did not, and long-term full amyloid removal in an open-label extension pointed toward a delay in symptom onset, a result that still needs confirmation in longer trials."
