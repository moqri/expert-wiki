headline: Development of clinical and DNA methylation biomarkers of biological aging and their determinants.
summary:
  - Morgan Levine's published work centers on measuring biological age, meaning how old a person's body behaves rather than how many birthdays they have had. Starting from routine clinical blood chemistry, Levine showed in large US national surveys (NHANES) that a "biological age" or "Phenotypic Age" built from about nine common lab values predicts death better than calendar age, even in people who appear healthy, and that Americans' biological age improved between 1988 and 2010.
  - Levine's best known work is DNAm PhenoAge (2018), a DNA methylation clock trained to track health and mortality risk rather than calendar age. It outperformed earlier clocks for death, cancer, healthspan, physical function and Alzheimer's disease. Later work built principal-component versions of six clocks that cut test-retest noise from up to 9 years to about 1.5 years, and Systems Age (2025), which estimates aging separately for 11 body systems, such as heart, lung, kidney and brain, from a single blood draw.
  - Applying these measures, Levine's papers report faster biological aging with earlier menopause, obesity and metabolic syndrome, schizophrenia, and later lung cancer and severe COVID-19, and slower aging with diets rich in plants and lean protein, education, and a fasting-mimicking diet. In the brain, faster epigenetic aging of the prefrontal cortex goes with more amyloid plaque and faster cognitive decline in Alzheimer's disease, and a brain-specific clock (PCBrainAge) tracks Alzheimer's dementia and APOE4 carrier status.
  - Levine's lab also studies where these clock signals come from, using cells aged in culture, reprogramming, and animals such as rats, mice and naked mole-rats. This work links epigenetic aging to cell division (a "replication" signature shared by aging and cancer), mitochondrial dysfunction and senescence, and shows that partial reprogramming can restore youthful methylation patterns and vision in mice. These summaries are drawn from Levine's published work, not Levine's personal views.
highlights:
  - "**Clinical biological age.** Developed a [phenotypic aging measure from routine blood chemistry](paper:pmid-30596641) in NHANES that captured morbidity and mortality risk beyond chronological age (*PLoS Medicine* 2018)."
  - "**Epigenetic clocks.** Developed [DNAm PhenoAge](paper:pmid-29676998), a methylation clock trained on phenotypic age, and [principal-component clocks](paper:pmid-36277076) that substantially improved test-retest reliability."
  - "**System-specific aging.** Developed [Systems Age](paper:pmid-40954326), which estimates aging of 11 physiological systems from a single blood methylation profile (*Nature Aging* 2025)."
  - "**Determinants and mechanisms.** Reported accelerated epigenetic aging with [earlier menopause](paper:pmid-27457926) and in the [prefrontal cortex in Alzheimer's disease](paper:pmid-26684672), and linked epigenetic aging to [replication-driven changes shared with cancer](paper:pmid-37467337)."
