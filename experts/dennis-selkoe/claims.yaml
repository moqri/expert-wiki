- rank: 1
  figure: Imbalance
  figure_label: between making and clearing amyloid-β is a very early, often initiating step in Alzheimer's
  statement: Every dominant mutation that causes early-onset Alzheimer's sits either in APP, the protein Aβ is cut from, or in presenilin, the enzyme that cuts it. An extra copy of APP in Down syndrome leads to Aβ deposits in the teens, APOE4 slows Aβ clearance, and low spinal fluid Aβ42 and amyloid PET precede other signs of the disease by many years.
  paper: pmid-27025652
  evidence: Review of genetic, biochemical, animal and human biomarker evidence, 25 years after the hypothesis was proposed
  tags: [Amyloid hypothesis]
