slug: dennis-selkoe
name: Dennis J. Selkoe
credentials: MD
affiliation: Brigham and Women's Hospital and Harvard Medical School
department: Ann Romney Center for Neurologic Diseases, Department of Neurology
areas: [Alzheimer's]
headline: Production, clearance and synaptic toxicity of amyloid-β in Alzheimer's disease, and α-synuclein biology in Parkinson's disease.
summary:
  - "Selkoe's work is closely tied to the amyloid hypothesis, the idea that an imbalance between making and clearing the amyloid-β (Aβ) protein starts Alzheimer's disease. In the 1980s Selkoe's group helped show that tau protein is a main part of the tangles inside dying neurons. In 1992 the group found that cells make Aβ during normal metabolism, which opened the way to cell-based drug screens, and showed that a mutation in the APP gene from a Swedish family raises Aβ production six- to eight-fold."
  - "Selkoe's group then linked every known inherited cause of early-onset Alzheimer's to Aβ. Mutations in APP and in the presenilin genes raised the long, sticky Aβ42 form in the blood of carriers, in cells and in mice. The group found that presenilin carries the two key aspartate residues of γ-secretase, the enzyme that releases Aβ, and that γ-secretase is a complex of four proteins. On the clearance side, the group identified insulin-degrading enzyme as an Aβ-degrading enzyme and showed that raising it or neprilysin in mice prevented plaques."
  - "A second theme is that small soluble clumps of Aβ, rather than plaques, harm synapses. Selkoe's group showed that naturally made Aβ oligomers, and Aβ dimers extracted from Alzheimer's brains, block the synaptic strengthening behind memory, remove dendritic spines, trigger tau changes and impair learning in rats, and that antibodies against Aβ prevent these effects. Selkoe has co-written appropriate use recommendations for the antibodies lecanemab, donanemab and aducanumab."
  - "In Parkinson's disease, Selkoe's group reported that α-synuclein normally exists partly as a folded tetramer that resists clumping, that Parkinson's-causing mutations shift it toward unfolded monomers, and that mice unable to form tetramers develop a Parkinson's-like movement disorder that responds to L-DOPA. Recent work points to fatty acid metabolism, including the enzyme stearoyl-CoA desaturase, as a possible drug target."
highlights:
  - "**Amyloid-β production.** Showed that cultured cells [secrete amyloid-β during normal metabolism](paper:pmid-1383826) and that a familial APP mutation [increases amyloid-β production](paper:pmid-1465129), findings central to the amyloid hypothesis."
  - "**Presenilins and γ-secretase.** Found that presenilin mutations [increase Aβ42 in vivo](paper:pmid-8705854) and that [two transmembrane aspartates in presenilin-1](paper:pmid-10206644) are required for γ-secretase activity."
  - "**Soluble Aβ oligomers.** Showed that [naturally secreted Aβ oligomers inhibit hippocampal long-term potentiation](paper:pmid-11932745) and that [Aβ dimers isolated from Alzheimer's brains](paper:pmid-18568035) impair synaptic plasticity and memory."
  - "**α-Synuclein.** Reported that α-synuclein [occurs physiologically as a folded tetramer](paper:pmid-21841800) that resists aggregation, and that Parkinson's-causing mutations [shift tetramers toward monomers](paper:pmid-26076669)."
