slug: vadim-gladyshev
name: Vadim Gladyshev
credentials: PhD
affiliation: Brigham and Women's Hospital and Harvard Medical School
department: Division of Genetics, Department of Medicine
areas: [Aging]
headline: Molecular biomarkers of aging, comparative biology of longevity, and selenoprotein biology.
summary:
  - Vadim Gladyshev's work asks what aging is at the molecular level and how it can be measured. Gladyshev's group builds aging clocks from DNA methylation, gene activity and blood proteins, in single cells, in individual organs and across mammals, and uses them to test what speeds aging up or slows it down. A recurring finding is that biological age is not a one-way trajectory. It rises with stress such as surgery, pregnancy or severe COVID-19 and falls again on recovery, it resets to a minimum ("ground zero") early in embryonic development, and it can be lowered in old mice by long-term exposure to young blood.
  - A second line of work compares species. Sequencing the genomes and cells of exceptionally long-lived animals such as the naked mole-rat, Brandt's bat, the beaver and the bowhead whale, and comparing gene activity across dozens of mammals, Gladyshev's group finds that long life tends to come with better DNA repair, more accurate protein synthesis and specific shifts in metabolism. Some of these traits can be moved into other species, as when a naked mole-rat gene for hyaluronan made mice live longer with less cancer.
  - The same molecular signatures are used to find and test longevity interventions in mice, including rapamycin given only early in life, drugs predicted from gene expression signatures, and a torpor-like state that lowers body temperature. In people, Gladyshev's work links a lower load of rare damaging gene variants to longer life and healthspan, including in centenarians. Earlier, Gladyshev mapped the selenoproteins, the proteins that carry the trace element selenium, including the 25 found in humans. These summaries are drawn from Gladyshev's published papers.
highlights:
  - "**Dynamics of biological age.** Showed that biological age increases with stress such as surgery, pregnancy and severe COVID-19 and is restored upon recovery ([*Cell Metabolism* 2023](paper:pmid-37086720)), and identified a rejuvenation event during embryogenesis ([*Science Advances* 2021](paper:pmid-34172448))."
  - "**Comparative longevity.** Sequenced the genome of the naked mole-rat ([*Nature* 2011](paper:pmid-21993625)) and showed that naked mole-rat Has2 expression increases hyaluronan and improves healthspan in mice ([*Nature* 2023](paper:pmid-37612507))."
  - "**Longevity interventions.** Identified gene expression signatures associated with lifespan extension ([*Cell Metabolism* 2019](paper:pmid-31353263)) and showed that rapamycin treatment during development extends lifespan in male mice ([*Science Advances* 2022](paper:pmid-36112674))."
  - "**Selenoproteins.** Characterized the mammalian selenoproteomes, including the 25 human selenoprotein genes ([*Science* 2003](paper:pmid-12775843))."
