headline: Studies what aging is, how to measure it, why some species live far longer than others, and whether biological age can be turned back.
summary:
  - Vadim Gladyshev's work asks what aging is at the molecular level and how it can be measured. His group builds aging clocks from DNA methylation, gene activity and blood proteins, in single cells, in individual organs and across mammals, and uses them to test what speeds aging up or slows it down. A recurring finding is that biological age is not a one-way trajectory. It rises with stress such as surgery, pregnancy or severe COVID-19 and falls again on recovery, it resets to a minimum ("ground zero") early in embryonic development, and it can be lowered in old mice by long-term exposure to young blood.
  - A second line of work compares species. Sequencing the genomes and cells of exceptionally long-lived animals such as the naked mole-rat, Brandt's bat, the beaver and the bowhead whale, and comparing gene activity across dozens of mammals, his group finds that long life tends to come with better DNA repair, more accurate protein synthesis and specific shifts in metabolism. Some of these traits can be moved into other species, as when a naked mole-rat gene for hyaluronan made mice live longer with less cancer.
  - The same molecular signatures are used to find and test longevity interventions in mice, including rapamycin given only early in life, drugs predicted from gene expression signatures, and a torpor-like state that lowers body temperature. In people, his work links a lower load of rare damaging gene variants to longer life and healthspan, including in centenarians. Earlier in his career he mapped the selenoproteins, the proteins that carry the trace element selenium, including the 25 found in humans. These summaries are drawn from his published papers.
tags: [Biomarkers of aging, Rejuvenation, Longevity across species, Longevity interventions, Genetics of longevity, Nature of aging, Selenium and redox biology]
