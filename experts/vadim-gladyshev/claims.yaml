  statement: People who inherit more of the rarest protein-truncating gene variants have shorter healthspan and lifespan, accounting for about 0.4 and 1.3 years of variation. Such mutations acquired during life explain only a small part of aging.
  paper: pmid-32254024
  evidence: Analysis of two large human cohorts with genetic and health data
  tags: [Genetics of longevity]

