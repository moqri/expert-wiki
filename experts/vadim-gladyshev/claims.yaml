  figure_label: and less cancer in mice given a naked mole-rat gene
  statement: Mice carrying the naked mole-rat version of the hyaluronan-making gene Has2 had more hyaluronan, less cancer, longer lifespan and better health, mainly through lower inflammation. A longevity trait from one species can be moved to another.
  paper: pmid-37612507
  evidence: Transgenic mice expressing naked mole-rat Has2
  tags: [Longevity across species, Longevity interventions]

