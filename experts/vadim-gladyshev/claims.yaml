- rank: 1
  figure: Reversible
  figure_label: rise in biological age during stress
  statement: Biological age goes up quickly under stress and comes back down after recovery. This was seen in young mice joined to old mice and then separated, and in people and mice around major surgery, pregnancy and severe COVID-19.
  paper: pmid-37086720
  evidence: Epigenetic, transcriptomic and metabolomic aging clocks in mouse parabiosis and in human and mouse stress cohorts
  tags: [Biomarkers of aging, Rejuvenation]

- rank: 2
  figure: Ground zero
  figure_label: the point in early embryo development where biological age is lowest
  statement: Biological age drops during early embryo development, reaches a minimum, and then starts rising again. This natural rejuvenation was seen in both mice and humans, and suggests organismal aging begins from this "ground zero".
  paper: pmid-34172448
  evidence: New multi-tissue epigenetic clock plus other aging clocks applied to mouse and human prenatal development
  tags: [Rejuvenation, Nature of aging]

- rank: 3
  figure: Longer life
  figure_label: for old mice after 3 months joined to young mice
  statement: Old mice that shared blood circulation with young mice for 3 months, then were separated for 2 months, lived longer and were healthier than controls. Their blood and liver epigenetic age stayed lower even after separation.
  paper: pmid-37500973
  evidence: Extended heterochronic parabiosis in mice with lifespan follow-up and multi-omic clocks
  tags: [Rejuvenation, Longevity interventions]

- rank: 4
  figure: ">11,000"
  figure_label: transcriptomes from 4 mammals used to find shared signs of aging
  statement: Aging changes in gene activity are shared across mouse, rat, macaque and human, and some, such as higher CDKN1A and LGALS3, also predict death and multiple diseases in people. Chronic diseases mainly sped up aging of inflammation genes, while caloric restriction acted on mitochondrial and metabolic genes.
  paper: pmid-42203874
  evidence: Integration of more than 11,000 transcriptomes from more than 25 tissues, with UK Biobank protein validation
  tags: [Biomarkers of aging, Longevity across species]

- rank: 5
  figure: 41
  figure_label: mammalian species compared for lifespan signatures
  statement: Long-lived species and lifespan-extending treatments share some features, such as lower Igf1 and higher mitochondrial protein synthesis, but differ in others. A drug picked by these signatures, KU0063794, extended lifespan and healthspan in mice.
  paper: pmid-37269831
  evidence: Multi-tissue RNA-seq across 41 mammalian species and lifespan-extending interventions, with a mouse lifespan study
  tags: [Longevity across species, Longevity interventions]

- rank: 6
  figure: 17
  figure_label: lifespan-extending interventions with shared liver gene changes
  statement: Many different ways of extending mouse lifespan produce similar gene expression changes in the liver, including higher oxidative phosphorylation and drug metabolism. These shared signatures pointed to new candidates such as chronic hypoxia and ascorbyl palmitate.
  paper: pmid-31353263
  evidence: RNA-seq of mice on 8 longevity interventions, extended to 17 with public data
  tags: [Longevity interventions, Biomarkers of aging]

- rank: 7
  figure: "+10%"
  figure_label: median lifespan from rapamycin in the first 45 days of life
  statement: Giving mice rapamycin only during their first 45 days slowed growth, extended median lifespan by 10% (most strongly in males) and kept them healthier in old age. Their liver was molecularly younger at the end of treatment, and rapamycin during development also extended lifespan in water fleas.
  paper: pmid-36112674
  evidence: Lifespan and healthspan study in genetically diverse UM-HET3 mice, plus Daphnia magna
  tags: [Longevity interventions]

- rank: 8
  figure: Lower body temperature
  figure_label: drives slower epigenetic aging in a torpor-like state
  statement: Switching on a group of brain neurons put mice into a torpor-like state, which slowed epigenetic aging across tissues and improved healthspan. The slowing came from lower body temperature rather than lower metabolism or eating less.
  paper: pmid-40055478
  evidence: Neural induction of a torpor-like state in mice, with epigenetic clocks and healthspan measures
  tags: [Longevity interventions, Biomarkers of aging]

- rank: 9
  figure: 18
  figure_label: rodent species showing DNA break repair improves with lifespan
  statement: Longer-lived rodent species repair DNA double-strand breaks better, largely because their SIRT6 protein is more active. Five amino acids explain the difference between the weak mouse and strong beaver SIRT6.
  paper: pmid-31002797
  evidence: Comparative DNA repair assays in cells from 18 rodent species
  tags: [Longevity across species]

- rank: 10
  figure: ">200 years"
  figure_label: lifespan of the bowhead whale, which repairs DNA unusually well
  statement: Bowhead whale cells repair DNA breaks more accurately and have lower mutation rates than other mammals' cells, helped by high levels of the protein CIRBP. Extra CIRBP extended lifespan in fruit flies.
  paper: pmid-41162698
  evidence: Bowhead whale primary cells compared with other mammals, plus human cell and fly experiments
  tags: [Longevity across species]

