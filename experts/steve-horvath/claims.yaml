  figure_label: for predicting time to death
  statement: GrimAge combines methylation-based estimates of seven plasma proteins (including PAI-1 and GDF15) and smoking pack-years. It outperformed earlier epigenetic clocks in predicting time to death, coronary heart disease and cancer, and was linked to fatty liver, visceral fat and age at menopause.
  paper: pmid-30669119
  evidence: Clock development with validation in thousands of people from large cohorts
  tags: [Epigenetic clocks, Health and mortality risk]
