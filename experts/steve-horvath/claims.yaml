- rank: 1
  figure: "51"
  figure_label: tissues and cell types read by one age formula
  statement: A single DNA methylation formula based on 353 sites estimates the age of most human tissues and cell types. It reads close to zero for embryonic and induced pluripotent stem cells, rises with the number of times cells are passaged in culture, and its "age acceleration" is highly heritable.
  paper: pmid-24138928
  evidence: Pan-tissue clock built from 8,000 samples in 82 datasets; tested in 6,000 cancer samples
  tags: [Epigenetic clocks]
