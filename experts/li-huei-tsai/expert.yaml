headline: Cellular and molecular mechanisms of Alzheimer's disease and non-invasive gamma sensory stimulation as a candidate therapy.
summary:
  - Li-Huei Tsai's work is best known for a non-invasive treatment idea called gamma sensory stimulation, in which people see light and hear sound flickering 40 times a second. In mouse models of Alzheimer's disease, Tsai's studies found that this rhythm lowered amyloid and tau, recruited the brain's immune cells (microglia), protected neurons and synapses, and improved memory. A 2024 study showed that it also speeds the brain's fluid-based waste clearance (the glymphatic system), which removes amyloid. In small human studies, daily 40 Hz light and sound for 3 months was safe and was linked to less brain shrinkage and better scores on a memory test, and a 2-year extension in 5 patients found less decline in some of them.
  - A second thread is APOE4, the strongest common genetic risk factor for Alzheimer's. Using stem-cell-derived human brain cells and post-mortem brains, Tsai's group found that APOE4 disrupts how brain cells handle fats and cholesterol. APOE4 astrocytes and microglia fill with fat droplets, and cholesterol gets stuck in oligodendrocytes, the cells that make myelin, which reduces myelin and memory in mice. Choline, a nutrient, restored the fat balance in APOE4 cells, and a small 6-month pilot in 13 healthy APOE4 carriers found that 2,200 mg a day of choline was safe and reached the brain.
  - Tsai's lab has also built large single-cell maps of the human brain in Alzheimer's disease, from 48 people in 2019 to 2.3 million cells from 427 people in 2023. These maps show which cells are hit early, that myelin-making cells are repeatedly affected, and which cell types and genes are linked to keeping memory despite brain disease. Mouse and human data point to MEF2 genes in neurons as one source of this resilience.
  - Earlier work laid the molecular groundwork. Tsai discovered p35, the partner that switches on the brain enzyme Cdk5, and showed that a cut-down form, p25, builds up in Alzheimer's brains and drives tau tangles and neuron death. Tsai's group also showed that the enzyme HDAC2 rises in Alzheimer's and silences memory genes, and that normal brain activity briefly breaks DNA to switch on learning genes, while lasting DNA breaks contribute to neurodegeneration.
highlights:
  - "**Gamma sensory stimulation.** Showed in mouse models that [40 Hz gamma entrainment reduces amyloid load](paper:pmid-27929004) and recruits microglia, and that multisensory gamma stimulation [promotes glymphatic clearance of amyloid](paper:pmid-38418876)."
  - "**APOE4 and lipid metabolism.** Using human iPSC-derived cells, found that APOE4 [disrupts intracellular lipid homeostasis in glia](paper:pmid-33658354) and [impairs myelination via cholesterol dysregulation](paper:pmid-36385529) in oligodendrocytes."
  - "**Single-cell atlases.** Generated [single-cell transcriptomic profiles of the Alzheimer's brain](paper:pmid-31042697) and an [atlas of 2.3 million cells from 427 individuals](paper:pmid-37774677) identifying correlates of cognitive resilience to Alzheimer's pathology."
  - "**Cdk5 and epigenetic regulation.** Showed that [conversion of p35 to p25 deregulates Cdk5](paper:pmid-10604467) and promotes neurodegeneration, and that [HDAC2 negatively regulates memory formation](paper:pmid-19424149) and synaptic plasticity."
