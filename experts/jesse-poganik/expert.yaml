areas: [Aging]
headline: Dynamics of biological age under stress and organ transplantation, and validation of biomarkers of aging.
summary:
  - "Jesse Poganik's work treats biological age as something that moves in both directions rather than only climbing. In mice and people, Poganik and colleagues found that biological age rose quickly during stresses such as major surgery, pregnancy and severe COVID-19, then came back down after recovery. Joining the blood supply of young and old mice aged the young animals, and separating them reversed it."
  - "Transplant studies extend this idea to single organs. Transplanted hearts, fat tissue and ovaries took on the biological age of the body they were placed in, so an old organ in a young host became molecularly younger. In heart transplant patients, the heart's biological age tracked the recipient's age more than the donor's. Building on the pregnancy findings, Poganik has proposed that the time between pregnancies may shape how much a mother's biological age recovers."
  - "A second thread is making biomarkers of aging trustworthy. Poganik co-authored the Biomarkers of Aging Consortium's framework for what an aging biomarker is and how to validate it, surveys of experts on the barriers to using these tests in clinics, recommendations for trials, and Biolearn, an open tool that compared 39 aging clocks in more than 20,000 people. A survey of aging researchers led by Poganik found no majority view even on what aging is or when it begins."
  - "Before moving to aging research, Poganik trained in chemical biology, building tools to deliver reactive molecules to one chosen protein in living cells and zebrafish, and using them to work out how the multiple sclerosis drug dimethyl fumarate (Tecfidera) kills specific immune cells."
highlights:
  - "**Reversible biological age.** First author of a study showing that [biological age increases with stress](paper:pmid-37086720), including heterochronic parabiosis, major surgery, pregnancy and severe COVID-19, and is restored after recovery."
  - "**Organ transplantation.** In mice and patients, [transplanted hearts assimilated the recipient's biological age](paper:pmid-42779719); in mice, [old white adipose tissue was rejuvenated](paper:pmid-41509418) after transplantation into young hosts."
  - "**Biomarkers of aging.** Co-authored the Biomarkers of Aging Consortium's [definitions and evaluation criteria](paper:pmid-37657418) for aging biomarkers and contributed to a [survey of researchers](paper:pmid-39660064) that found no consensus on foundational questions about aging."
  - "**Chemical biology.** Earlier work developed [Z-REX](paper:pmid-37020146), a method for delivering reactive electrophiles to specific proteins in zebrafish, and identified [mediators of immune-cell apoptosis induced by dimethyl fumarate](paper:pmid-34593792)."
