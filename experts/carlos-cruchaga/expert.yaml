headline: Uses human genetics and large-scale protein measurements in spinal fluid, blood and brain to find what drives Alzheimer's disease, which proteins could be drug targets, and which blood tests can detect it early.
summary:
  - Carlos Cruchaga's published work centres on one question, which genes and proteins change a person's risk of Alzheimer's disease and how fast it progresses. Early on, his group used the levels of amyloid and tau in spinal fluid as measurable stand-ins for the disease, which let them find genetic variants that affect tau levels and the speed of decline, not just whether someone gets the disease. Sequencing families with many affected members found rare variants with large effects, such as in the PLD3 gene, and showed that risk variants in TREM2 differ between people of European and African ancestry.
  - A long line of work follows TREM2, a receptor on the brain's immune cells (microglia). His group showed that soluble TREM2 in spinal fluid rises in Alzheimer's, and that common variants near the MS4A genes raise soluble TREM2 and lower Alzheimer's risk. Later work pointed to the MS4A4A protein as the control knob and found that removing it in mice reduces amyloid plaques, which suggests it as a drug target.
  - More recently the work has moved to measuring thousands of proteins at once in spinal fluid, plasma and brain from tens of thousands of people, including carriers of inherited Alzheimer's mutations. These studies map how genes control protein levels in each fluid, name proteins that are likely causal and already druggable, chart which proteins change years before symptoms, and build blood and spinal fluid panels that detect Alzheimer's and predict who will decline. They also show that plasma does not always reflect the brain, so spinal fluid finds signals that blood misses.
tags: [Alzheimer's genetics, TREM2 and microglia, Protein maps, Blood and spinal fluid tests, Inherited Alzheimer's, APOE4, Treatment response]
