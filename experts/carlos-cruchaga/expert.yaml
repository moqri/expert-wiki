slug: carlos-cruchaga
name: Carlos Cruchaga
credentials: PhD
affiliation: Washington University School of Medicine in St. Louis
department: Department of Psychiatry; NeuroGenomics and Informatics Center
areas: [Alzheimer's]
headline: Genetic and proteomic determinants of Alzheimer's disease risk, progression and fluid biomarkers.
summary:
  - Carlos Cruchaga's published work centres on one question, which genes and proteins change a person's risk of Alzheimer's disease and how fast it progresses. Early on, Cruchaga's group used the levels of amyloid and tau in spinal fluid as measurable stand-ins for the disease, which let them find genetic variants that affect tau levels and the speed of decline, not just whether someone gets the disease. Sequencing families with many affected members found rare variants with large effects, such as in the PLD3 gene, and showed that risk variants in TREM2 differ between people of European and African ancestry.
  - A long line of work follows TREM2, a receptor on the brain's immune cells (microglia). Cruchaga's group showed that soluble TREM2 in spinal fluid rises in Alzheimer's, and that common variants near the MS4A genes raise soluble TREM2 and lower Alzheimer's risk. Later work pointed to the MS4A4A protein as the control knob and found that removing it in mice reduces amyloid plaques, which suggests it as a drug target.
  - More recently the work has moved to measuring thousands of proteins at once in spinal fluid, plasma and brain from tens of thousands of people, including carriers of inherited Alzheimer's mutations. These studies map how genes control protein levels in each fluid, name proteins that are likely causal and already druggable, chart which proteins change years before symptoms, and build blood and spinal fluid panels that detect Alzheimer's and predict who will decline. They also show that plasma does not always reflect the brain, so spinal fluid finds signals that blood misses.
highlights:
  - "**Endophenotype genetics.** Used cerebrospinal fluid tau levels as quantitative traits to identify Alzheimer's risk variants ([*Neuron* 2013](paper:pmid-23562540)) and identified rare PLD3 coding variants that confer disease risk ([*Nature* 2014](paper:pmid-24336208))."
  - "**TREM2 and microglia.** Contributed to the identification of TREM2 risk variants ([*NEJM* 2013](paper:pmid-23150934)) and showed that soluble TREM2 in cerebrospinal fluid is elevated in Alzheimer's disease ([*Acta Neuropathologica* 2016](paper:pmid-26754641))."
  - "**Proteogenomic atlases.** Mapped genetic regulation of proteins in brain, cerebrospinal fluid and plasma ([*Nature Neuroscience* 2021](paper:pmid-34239129)) and prioritized putative causal, partly druggable proteins for Alzheimer's disease from a CSF protein QTL atlas ([*Nature Genetics* 2024](paper:pmid-39528825))."
  - "**Disease course.** Characterized cerebrospinal fluid proteomic changes across the natural history of autosomal dominant Alzheimer's disease ([*Nature Medicine* 2023](paper:pmid-37550416)), and reported that Ms4a4a deficiency reduces plaque pathology in mice ([*Alzheimer's & Dementia* 2025](paper:pmid-40843775))."
