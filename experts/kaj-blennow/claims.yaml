  figure: "AUC 0.90–0.98"
  figure_label: for a blood p-tau181 test separating Alzheimer's from healthy older adults
  statement: A new blood test for tau phosphorylated at position 181 (p-tau181), tested in 1,131 people from four cohorts, rose step by step along the course of Alzheimer's disease. It separated Alzheimer's dementia from cognitively healthy older adults with an AUC of 0.90 to 0.98, told it apart from other brain diseases such as frontotemporal and vascular dementia, and predicted memory decline and shrinkage of the hippocampus over 1 year.
  paper: pmid-32333900
  evidence: Assay development and validation in 4 prospective cohorts, 1,131 participants
  tags: [Blood tests, Amyloid and tau]
