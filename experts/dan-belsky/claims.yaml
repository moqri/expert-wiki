  statement: In Dunedin Study members followed through their 20s and 30s, the decline of lungs, gums, heart, kidneys, liver and immune function ran faster in some people than others. By age 38, the faster agers were less physically able, showed early cognitive decline and brain aging, rated their health worse and looked older.
  paper: pmid-26150497
  evidence: Birth cohort, 954 people, 3 time points over 12 years
  tags: [Pace of aging]

