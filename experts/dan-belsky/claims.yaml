- rank: 1
  figure: 1 blood test
  figure_label: estimates how fast a person is aging right now
  statement: DunedinPACE condenses twenty years of decline in 19 measures of organ health into a single DNA methylation blood test. It gave consistent results on repeat testing, was linked to disease, disability and death, and added prediction beyond the GrimAge clock.
  paper: pmid-35029144
  evidence: Dunedin Study birth cohort (born 1972-73), tested in five more datasets
  tags: [Pace of aging, Measuring aging]

- rank: 2
  figure: 25%
  figure_label: calorie restriction for 2 years slowed the pace of aging
  statement: In the CALERIE trial, healthy adults without obesity assigned to cut calories by 25% for two years had a slower pace of aging on DunedinPACE than those on their usual diet. Biological age estimates from other clocks, including PhenoAge and GrimAge, did not change significantly, and the effects were small.
  paper: pmid-37118425
  evidence: Randomized controlled trial, 220 adults
  tags: [Interventions and lifestyle, Pace of aging]

- rank: 3
