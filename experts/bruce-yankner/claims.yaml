  statement: Injecting fibrillar amyloid-β at plaque-like concentrations into the cortex of aged rhesus monkeys caused severe neuron loss, tau phosphorylation and microglial growth, but not in young adult monkeys. Toxicity was weaker in aged marmosets and not significant in aged rats, suggesting long-lived primates are uniquely vulnerable.
