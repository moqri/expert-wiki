- rank: 1
  figure: ~50% less lithium
  figure_label: in the brain speeds up Alzheimer's changes and memory loss in mice
  statement: Of the metals measured, only lithium was lower in the brains of people with mild cognitive impairment, and in Alzheimer's disease it was further trapped by amyloid plaques. Halving brain lithium in mice increased amyloid plaques, tau buildup, brain inflammation and loss of synapses, and sped memory decline. Low-dose lithium orotate, a form that is not trapped by amyloid, prevented these changes and memory loss in Alzheimer's mice and old normal mice; human trials are still needed.
  paper: pmid-40770094
  evidence: Human brain metal measurements plus mouse diet and treatment studies
  tags: [Lithium, Amyloid and tau]
- rank: 2
  figure: REST
  figure_label: rises in healthy aging neurons and is lost in Alzheimer's disease
  statement: The gene-silencing protein REST is switched on in neurons of the cortex and hippocampus during normal aging, where it turns off genes that promote cell death and Alzheimer's pathology and turns on stress defenses. REST is lost in mild cognitive impairment and Alzheimer's disease, and REST levels in aging tracked closely with keeping cognitive function and with longevity. Mice lacking REST in the brain developed age-related neurodegeneration.
  paper: pmid-24670762
  evidence: Postmortem human brains, mouse knockouts, cultured neurons and worms
  tags: [Brain resilience and REST, Brain aging]
- rank: 3
  figure: After age 40
  figure_label: genes for memory and energy in the human cortex start to decline
  statement: Gene activity in the frontal cortex of people aged 26 to 106 showed a set of genes for synaptic plasticity, vesicle transport and mitochondria that drop after age 40, followed by a rise in stress response and DNA repair genes. DNA damage was markedly higher at the promoters of the declining genes, suggesting brain aging begins early in adult life.
  paper: pmid-15190254
  evidence: Gene expression profiling of human frontal cortex across ages 26–106, plus cultured human neurons
  tags: [Brain aging]
- rank: 4
  figure: Lower neural excitation
  figure_label: in the cortex of people who lived longest
  statement: People with extended longevity had a cortex gene signature with lower activity of genes for neural excitation and synapses, and higher REST. In worms, reducing neural excitation extended lifespan, and adding the worm version of REST suppressed excitation and lengthened life. REST-deficient mice had overactive cortex during aging.
  paper: pmid-31619788
  evidence: Human brain transcriptomes from long-lived people, plus worm and mouse genetics
  tags: [Longevity, Brain resilience and REST]
