  figure: Checkpoint
  figure_label: REST holds back Alzheimer's changes in older people without symptoms
  statement: Many older people carry Alzheimer's pathology without cognitive decline. REST was induced in cognitively intact older people and in Alzheimer's mice at the onset of amyloid and tau buildup, lowering gamma secretase, tau kinases and cell death genes. Deleting REST in two Alzheimer's mouse models sped amyloid and tau buildup, neurodegeneration and memory loss, while adding REST in the hippocampus reduced them.
  paper: pmid-37919281
  evidence: Postmortem human brains and two Alzheimer's mouse models with REST deleted or added
  tags: [Brain resilience and REST, Amyloid and tau]
