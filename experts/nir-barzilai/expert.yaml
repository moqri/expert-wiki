headline: Studies people who live to 100 to find the genes and biology that protect them, and tests whether drugs such as metformin can slow aging itself.
summary:
  - Much of this work comes from the Longevity Genes Project, a study of Ashkenazi Jewish centenarians, their children, and comparison groups. People who reach 100 get the major diseases of aging 18 to 24 years later than others, and their children carry part of that advantage, with lower rates of heart disease, high blood pressure, stroke and Alzheimer's disease. Centenarians do not have healthier habits than their peers, which points to protective biology rather than lifestyle.
  - The papers trace that protection to specific genes. Centenarians more often carry variants that raise HDL ("good") cholesterol particle size (CETP), lower APOC3, or partly dampen growth hormone and IGF-1 signaling (IGF1R, GHR). They carry as many disease-causing mutations as everyone else, but fewer gene-breaking mutations overall and more variants that protect against Alzheimer's disease, including in carriers of the APOE4 risk gene.
  - Earlier laboratory work showed that belly (visceral) fat drives insulin resistance with age. Surgically removing it in rats restored insulin action, delayed diabetes and lengthened life, and part of the benefit of calorie restriction runs through losing this fat.
  - Building on this, the work argues that aging itself should be treated as a target for prevention, so that many diseases can be delayed at once. It proposed TAME (Targeting Aging with Metformin), a proposed trial of metformin to delay age-related diseases, and set out criteria for choosing biomarkers and other approved drugs for such trials.
