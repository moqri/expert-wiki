- rank: 1
  figure: 18-24 years
  figure_label: later onset of major diseases in people who live to about 100
  statement: People aged 95 and older developed cancer, heart disease, diabetes, high blood pressure and osteoporosis much later than younger comparison groups. The age at which 20% of them had a given disease was 18 to 24 years later, and the same pattern held in two separate centenarian studies.
  paper: pmid-27377170
  evidence: Case-control study of 1,937 people aged 95+ in two cohorts (Longevity Genes Project, New England Centenarian Study)
  tags: [Centenarians]
- rank: 2
  figure: 42% lower
  figure_label: risk of death for children of centenarians
  statement: Across three independent cohorts in the US and UK, children of centenarians had a 42% lower risk of death, 33% lower risk of heart disease and 32% lower risk of high blood pressure than people whose parents lived shorter lives. Death came about 3 years later and high blood pressure about 5 years later.
  paper: pmid-42646838
  evidence: Meta-analysis of three cohorts, 4,030 participants (LonGenity, New England Centenarian Study, UK Biobank)
  tags: [Centenarians, Heart and cholesterol]
- rank: 3
  figure: No difference
  figure_label: in diet, exercise, smoking or drinking between centenarians and their peers
  statement: People living independently at 95 and older had the same body weight, drinking, exercise and diet habits as people of the same birth years in the general population. Their long life did not come from a healthier lifestyle.
  paper: pmid-21812767
  evidence: Comparison of 477 people aged 95-109 with 3,164 people from the same birth cohort (NHANES I)
  tags: [Centenarians]
- rank: 4
  figure: "43% lower"
  figure_label: rate of Alzheimer's disease in children of long-lived parents
  statement: Older adults with at least one parent who lived to 85 or beyond developed Alzheimer's disease at a lower rate (hazard ratio 0.57) and had slower memory decline over up to 23 years of follow-up, even after accounting for heart disease, diabetes and stroke.
  paper: pmid-20487085
  evidence: Community cohort of 424 adults aged 75-85 followed up to 23 years (Bronx Aging Study)
  tags: [Brain health, Centenarians]
- rank: 5
  figure: 3x
  figure_label: more common CETP "VV" genotype in centenarian men
  statement: Centenarians and their children had larger HDL and LDL cholesterol particles, linked to less high blood pressure, heart disease and metabolic syndrome. They were about three times (men) as likely to carry two copies of a CETP variant (I405V) that lowers CETP and enlarges these particles.
  paper: pmid-14559957
  evidence: Case-control study of 213 centenarians, 216 offspring and 847 controls
  tags: [Genetics of longevity, Heart and cholesterol]
- rank: 6
  figure: 2x
  figure_label: as likely to have good memory at 99 with the CETP longevity genotype
  statement: Among people about 99 years old, those with a good memory score were twice as likely to carry the CETP VV longevity genotype. In a younger cohort, the same genotype was about five times more common in people without dementia.
  paper: pmid-17190939
  evidence: Two cohorts, 158 people with exceptional longevity and the Einstein Aging Study
  tags: [Brain health, Genetics of longevity]
- rank: 7
  figure: 25% vs 10%
  figure_label: carry the protective APOC3 genotype, centenarians vs controls
  statement: A variant in the APOC3 gene that lowers blood APOC3 was carried in two copies by 25% of centenarians and 20% of their children, versus 10% of controls. Carriers had better cholesterol profiles, less high blood pressure, better insulin sensitivity and longer survival.
  paper: pmid-16602826
  evidence: Genetic association study of 66 variants in 36 genes in 687 people, plus a prospective survival cohort
  tags: [Genetics of longevity, Heart and cholesterol]
- rank: 8
  figure: IGF1R
  figure_label: mutations that reduce growth signaling are enriched in female centenarians
  statement: Female centenarians more often carried mutations in the IGF-1 receptor gene that reduce how strongly cells respond to IGF-1, a growth hormone signal. Their daughters were shorter and had higher IGF-1 levels, suggesting that slightly dampened growth signaling favors long life in humans as in animals.
  paper: pmid-18316725
  evidence: Gene sequencing and cell studies in Ashkenazi centenarians, offspring and controls
  tags: [Genetics of longevity, Growth hormone and IGF-1]
- rank: 9
  figure: Lower IGF-1
  figure_label: predicts longer survival in women in their 90s
  statement: Among people in their 90s, women with IGF-1 levels below the median lived significantly longer than women above it. In men and women with a history of cancer, lower IGF-1 also predicted longer survival.
