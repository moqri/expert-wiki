  figure_label: link between IGF-1 and disease, harmful when high in later life
  statement: In 440,185 UK adults, younger people with high IGF-1 were protected from disease while older people with high IGF-1 had more disease and death. Both very high and very low levels carried risk, across dementia, heart disease, diabetes, osteoporosis and death.
