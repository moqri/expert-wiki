  statement: Rare protein-changing variants enriched in centenarians mostly fell in the insulin/IGF-1 and AMPK signaling pathways, the same pathways that control lifespan in laboratory animals. Rare Wnt pathway variants appeared to protect people carrying the Alzheimer's risk gene APOE4.
