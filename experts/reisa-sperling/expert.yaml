name: Reisa Sperling
credentials: MD, MMSc
affiliation: Mass General Brigham and Harvard Medical School
department: Department of Neurology; Massachusetts Alzheimer's Disease Research Center
areas: [Alzheimer's]
headline: Finding Alzheimer's disease years before memory loss begins, and testing whether treatment at that silent stage can prevent dementia.
summary:
  - Reisa Sperling's work starts from one idea, that Alzheimer's disease begins in the brain a decade or more before anyone notices memory problems. She led the 2011 NIA-AA workgroup that first defined this "preclinical" stage for research, and her imaging studies showed that older adults with no symptoms but high amyloid in the brain already have changes in the brain networks that support memory.
  - Through the Harvard Aging Brain Study and large trial screening programs, her papers track what happens next in cognitively normal people. Amyloid alone predicts modest decline; amyloid together with tau, brain shrinkage, or high vascular risk predicts much faster decline. Women tend to show more early tau than men, and early symptoms can include subtle changes in memory, processing speed, daily function and even loneliness.
  - She turned this into prevention trials. The A4 study screened about 4,500 older adults with amyloid PET and tested solanezumab in 1,169 of them; the drug did not slow decline over 240 weeks. The AHEAD 3-45 study is now testing lecanemab, a different anti-amyloid antibody, in people with intermediate or elevated amyloid and no symptoms. Her group also helped write the safety rules for amyloid-related imaging abnormalities (ARIA), the main side effect of these drugs.
  - Her recent work focuses on blood tests and remote digital testing. Plasma p-tau217 predicts who will progress to cognitive impairment, works similarly across racial groups for trial screening, and combined with a one-week smartphone learning test it can separate people at imminent risk from those likely to stay stable.
