name: Reisa Sperling
credentials: MD, MMSc
affiliation: Mass General Brigham and Harvard Medical School
department: Department of Neurology; Massachusetts Alzheimer's Disease Research Center
areas: [Alzheimer's]
headline: Characterization of preclinical Alzheimer's disease and secondary prevention trials in cognitively unimpaired older adults.
summary:
  - Reisa Sperling's work starts from one idea, that Alzheimer's disease begins in the brain a decade or more before anyone notices memory problems. Sperling led the 2011 NIA-AA workgroup that first defined this "preclinical" stage for research, and Sperling's imaging studies showed that older adults with no symptoms but high amyloid in the brain already have changes in the brain networks that support memory.
  - Through the Harvard Aging Brain Study and large trial screening programs, Sperling's papers track what happens next in cognitively normal people. Amyloid alone predicts modest decline; amyloid together with tau, brain shrinkage, or high vascular risk predicts much faster decline. Women tend to show more early tau than men, and early symptoms can include subtle changes in memory, processing speed, daily function and even loneliness.
  - Sperling turned this into prevention trials. The A4 study screened about 4,500 older adults with amyloid PET and tested solanezumab in 1,169 of them; the drug did not slow decline over 240 weeks. The AHEAD 3-45 study is now testing lecanemab, a different anti-amyloid antibody, in people with intermediate or elevated amyloid and no symptoms. Sperling's group also helped write the safety rules for amyloid-related imaging abnormalities (ARIA), the main side effect of these drugs.
  - Sperling's recent work focuses on blood tests and remote digital testing. Plasma p-tau217 predicts who will progress to cognitive impairment, works similarly across racial groups for trial screening, and combined with a one-week smartphone learning test it can separate people at imminent risk from those likely to stay stable.
highlights:
  - "**Preclinical Alzheimer's disease.** Led the NIA-AA workgroup that defined preclinical stages of Alzheimer's disease for research ([*Alzheimer's & Dementia* 2011](paper:pmid-21514248)) and showed altered default network function in amyloid-positive older adults without dementia ([*Neuron* 2009](paper:pmid-19640477))."
  - "**Amyloid, tau and decline.** In the Harvard Aging Brain Study, showed that amyloid and tau together are associated with faster cognitive decline in clinically normal adults ([*JAMA Neurology* 2019](paper:pmid-31157827)), with sex differences in regional tau deposition ([*JAMA Neurology* 2019](paper:pmid-30715078))."
  - "**Prevention trials.** Led the A4 study, in which solanezumab did not slow cognitive decline in preclinical Alzheimer's disease ([*N Engl J Med* 2023](paper:pmid-37458272)), and designed the AHEAD 3-45 lecanemab prevention trial ([*Alzheimer's & Dementia* 2023](paper:pmid-35971310))."
  - "**Blood and digital markers.** Estimated absolute risk of progression to cognitive impairment from plasma p-tau217 across six cohorts ([*JAMA* 2026](paper:pmid-42449500)) and developed a remote multi-day learning paradigm for detecting early deficits ([*NPJ Digital Medicine* 2025](paper:pmid-39806194))."
