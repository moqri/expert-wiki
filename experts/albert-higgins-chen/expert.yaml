name: Albert T. Higgins-Chen
credentials: MD, PhD
affiliation: Yale School of Medicine
department: Departments of Psychiatry and Pathology
areas: [Aging]
headline: Reliability, development and validation of DNA methylation clocks for measuring biological aging and its relation to mental illness.
summary:
  - "Higgins-Chen's best-known work tackles a hidden problem with epigenetic clocks: the same blood sample, measured twice, could give ages up to 9 years apart for six popular clocks. Rebuilding the clocks from principal components of the methylation data brought most repeat measurements within 1.5 years and made treatment effects easier to detect. Later work showed that most clocks are technically reproducible but much less stable in the same person from day to day, and that this biological noise can produce misleading results in trials."
  - "The group has also built new clocks. Systems Age estimates the age of 11 body systems, such as heart, lung, kidney and brain, from a single blood draw. OMICmAge folds in proteins, metabolites and routine clinical lab values while still being measured from DNA methylation alone. PCBrainAge, trained on brain tissue, tracked Alzheimer's disease and APOE4 status more closely than earlier clocks."
  - "A major goal is knowing when a clock result can be trusted in a longevity trial. Across 51 intervention studies, clocks trained on mortality or pace of aging responded most consistently. When published single-clock trial results were rechecked with other clocks, none of the extra clocks reached significance, which led the group to propose three checks before believing a result. Methylation signs of cell senescence did not fall after senolytic drugs."
  - "Trained in psychiatry, Higgins-Chen links mental health to aging. In schizophrenia, mortality-linked clocks were up to 5 years older, largely through smoking and age-associated blood proteins, and newer clocks showed faster aging in 10 of 11 body systems. A small pilot found lower clock ages after ketamine treatment for depression and PTSD. Most of these findings are associations or small pilots, not proof that changing a clock changes health."
highlights:
  - "**Clock reliability.** Showed that technical noise produces large discrepancies between repeated measurements of common epigenetic clocks and that principal-component versions improve reliability ([*Nature Aging* 2022](paper:pmid-36277076)); later distinguished technical from within-person biological variability ([*Aging Cell* 2026](paper:pmid-42525215))."
  - "**Multi-system clocks.** Co-developed [Systems Age](paper:pmid-40954326), which estimates aging of 11 physiological systems from a single blood methylation profile, and [OMICmAge](paper:pmid-41741793), which integrates multi-omic and clinical data into a methylation-based measure."
  - "**Clocks as trial endpoints.** Assessed epigenetic clocks across 51 intervention studies, finding the most consistent responses in mortality- and pace-trained clocks ([*Nature Medicine* 2026](paper:pmid-42629466)), and proposed criteria for interpreting clock results in trials ([*Aging Cell* 2026](paper:pmid-42850743))."
  - "**Psychiatric illness and aging.** Reported accelerated mortality-linked epigenetic aging in schizophrenia, driven partly by smoking ([*Biological Psychiatry* 2020](paper:pmid-32199607)), and reviewed mechanisms linking epigenetic aging and mental health ([*Biological Psychiatry* 2023](paper:pmid-36764569))."
tags: [Clock reliability, New aging clocks, Testing longevity treatments, Mental health and aging, Brain aging and Alzheimer's, Cell aging and energy, Standards for aging biomarkers]
