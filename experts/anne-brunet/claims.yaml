  figure: Akt → FOXO3
  figure_label: growth signals switch off a Forkhead factor that triggers cell death
  statement: When survival factors are present, the enzyme Akt tags the transcription factor FKHRL1 (now called FOXO3), which binds 14-3-3 proteins and is held outside the nucleus. When survival factors are withdrawn, FOXO3 moves into the nucleus and turns on genes needed for cell death, such as Fas ligand.
