  tags: [FOXO and longevity genes]
- rank: 2
  figure: SIRT1 + FOXO3
  figure_label: the longevity enzyme steers FOXO3 toward stress resistance, away from cell death
  statement: Under oxidative stress, the deacetylase SIRT1 (the mammalian version of the longevity enzyme Sir2) bound and deacetylated FOXO3. This made FOXO3 better at stopping the cell cycle and resisting oxidative stress, but worse at triggering cell death, suggesting one way Sir2-family proteins may extend life.
  paper: pmid-14976264
  evidence: Biochemical and cell experiments in mammalian cells
  tags: [FOXO and longevity genes]
