headline: Genetic, epigenetic and environmental regulation of lifespan and of neural stem cell aging in invertebrate and vertebrate models.
summary:
  - "Brunet's early work helped explain how growth signals keep cells alive. In 1999 Brunet and colleagues showed that the enzyme Akt switches off a Forkhead transcription factor, now called FOXO3, by keeping it out of the nucleus, and that without growth signals FOXO3 turns on genes that trigger cell death. Later studies showed FOXO3 also drives DNA repair, and that the longevity enzyme SIRT1 tips FOXO3 away from cell death and toward stress resistance. FOXO genes are among the best-known longevity genes across species."
  - "In the worm C. elegans, Brunet's lab found that an energy sensor, AMPK, works through FOXO to extend life under one form of dietary restriction, and that different diet regimens act through largely separate genes and add together. The lab also showed that lowering a chromatin mark, H3K4me3, extends lifespan, that this longer life is passed on to descendants for up to three generations, and that it works through the build-up of mono-unsaturated fats, which on their own extend worm lifespan. Males also shorten the lives of the opposite sex, even without mating."
  - "In the mouse brain, the group studies the neural stem cells that make new neurons. With age these cells struggle to wake up from rest: they collect protein clumps that larger lysosomes can clear, take up more glucose, and are held back by T cells that enter the old brain and release interferon-γ. Single-cell and spatial 'aging clocks' built from millions of brain cells showed that T cells age the cells around them while neural stem cells make neighbors younger, and that exercise, young blood and partial reprogramming each reverse parts of brain aging in mice."
  - "Brunet's lab built the African turquoise killifish, the shortest-lived vertebrate that can be raised in the lab, into a model for vertebrate aging, with a genome, fast gene editing and lifelong tracking. In this fish, behavior early in life forecast each animal's lifespan, and an embryo 'pause' state called diapause preserved fish for long periods without later cost. Brunet also contributed to UK Biobank work linking youthful brain and immune proteins in blood to longer life. Most findings come from worms, fish, mice and cells and have not been tested as treatments in people."
highlights:
  - "**FOXO transcription factors.** Showed that Akt inhibits a Forkhead transcription factor, now termed FOXO3, by phosphorylation ([*Cell* 1999](paper:pmid-10102273)) and that the deacetylase SIRT1 shifts FOXO activity toward stress resistance ([*Science* 2004](paper:pmid-14976264))."
  - "**Lifespan regulation in C. elegans.** Identified an AMPK-FOXO pathway that mediates lifespan extension by a form of dietary restriction ([*Current Biology* 2007](paper:pmid-17900900)) and transgenerational inheritance of longevity after H3K4me3 modifier deficiency ([*Nature* 2011](paper:pmid-22012258))."
  - "**Neural stem cell aging.** Showed that lysosome activation enhances activation of quiescent neural stem cells in old mice ([*Science* 2018](paper:pmid-29590078)) and that T cells infiltrating old neurogenic niches inhibit stem cell proliferation, in part via interferon-γ ([*Nature* 2019](paper:pmid-31270459))."
  - "**Killifish model.** Developed the African turquoise killifish as a vertebrate aging model, including its [genome](paper:pmid-26638078), and showed that diapause preserves organisms long term through Polycomb complex members ([*Science* 2020](paper:pmid-32079766))."
