  figure_label: the order of change over 7 years
  statement: Following clinically normal older adults for up to 7 years, a rise in amyloid came first, was followed by a rise in tau, and tau rise was followed by memory decline. People with high amyloid whose tau rose fastest went on to mild cognitive impairment.
