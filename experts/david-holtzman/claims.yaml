  evidence: Mouse tauopathy model on human APOE knock-in or knockout backgrounds, plus human imaging cohorts
  tags: [APOE, Tau]
- rank: 2
  figure: "Wake ↑ amyloid"
  figure_label: sleep-wake cycle regulates brain amyloid-β
  statement: Amyloid-β in the fluid around brain cells rose with wakefulness and during sleep deprivation, and fell when the wake-promoting signal orexin was blocked. Chronic sleep restriction increased amyloid plaques in mice, and an orexin receptor blocker reduced them.
