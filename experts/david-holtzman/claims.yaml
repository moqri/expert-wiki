  figure_label: independent of amyloid
  statement: In tau mice carrying human APOE genes, APOE4 caused markedly more brain shrinkage and inflammation than APOE2 or APOE3, while mice with no APOE were largely protected. In people with amyloid and Alzheimer's symptoms, APOE4 carriers progressed faster.
