  statement: Blood proteins that come from specific organs were used to estimate the age of 11 organs in 5,676 adults across five cohorts. Nearly 20% showed strongly accelerated aging in one organ and 1.7% in several. Accelerated organ aging carried 20–50% higher risk of death, faster heart aging carried 250% higher heart failure risk, and faster brain and vascular aging predicted Alzheimer's progression as well as the blood test pTau-181.
  paper: pmid-38057571
  evidence: Plasma proteomics and machine learning in 5 cohorts, 5,676 adults
  tags: [Organ aging clocks, Blood and spinal fluid biomarkers]
