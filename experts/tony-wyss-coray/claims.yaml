- rank: 1
  figure: 3.1× Alzheimer's risk
  figure_label: for people whose blood proteins show an especially old brain, similar to carrying one APOE4
  statement: Using 2,916 blood proteins from 44,498 UK Biobank participants to estimate the age of 11 organs, an especially aged brain raised the risk of Alzheimer's disease about as much as one copy of APOE4, while a youthful brain protected about as much as two copies of APOE2, regardless of APOE genotype. Organ ages also responded to lifestyle and medicines, and each extra aged organ raised the risk of death, up to 8.3 times for eight or more.
  paper: pmid-40634782
  evidence: Plasma proteomics in 44,498 UK Biobank participants with up to 17 years of follow-up
  tags: [Organ aging clocks, APOE4]
- rank: 2
