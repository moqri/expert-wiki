areas: [Aging]
headline: An epigenetics researcher who builds DNA methylation tests from simple samples, such as a cervical smear or cheek swab, to measure biological ageing and detect or predict women's cancers, and who helps set standards for validating biomarkers of aging.
summary:
  - Chiara Herzog's published work centres on DNA methylation, the chemical tags on DNA that change with age, exposures and disease. At the European Translational Oncology Prevention and Screening Institute in Innsbruck, Herzog helped develop the WID (Women's cancer risk IDentification) family of tests, which read methylation in easy-to-collect cervical, vaginal, cheek or blood samples to find women who have, or are about to develop, cervical, endometrial, ovarian or breast cancer.
  - Several of these tests have been validated in real-world settings. A simple swab test for endometrial and cervical cancer (WID-qEC) matched or outperformed ultrasound in women with abnormal bleeding in London and Ghana, and a methylation triage for HPV-positive women (WID-qCIN) predicted far more future precancers than cytology in a Stockholm screening cohort of 28,017 women. Related work shows that smoking and e-cigarette use leave shared methylation marks linked to lung cancer, and that the anti-progesterone drug mifepristone reverses methylation signs of breast cancer risk.
  - Herzog's ageing research links these tools to biological age. Herzog built tissue-specific epigenetic clocks, showed that the gap between epithelial and general clocks tracks hormone-related cancer risk, and is a leading author of the Biomarkers of Aging Consortium papers that define, validate and benchmark biomarkers of aging for use in longevity trials. These summaries are drawn from Herzog's published work, not Herzog's personal views.
