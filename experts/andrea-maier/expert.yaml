headline: A geriatrician who studies how to measure and slow biological ageing in people, from muscle health in hospital patients to healthy longevity clinics and supplement trials.
summary:
  - Andrea Maier's published work spans the full path from the biology of ageing to the clinic. Her early research in the Leiden Longevity Study and the Leiden 85-plus Study compared people from long-lived families with their peers and followed 85-year-olds for a decade, showing that markers such as skin senescent cells, glucose rhythms, immune profiles and grip strength track how fast a person is ageing and how long they are likely to live.
  - A large part of her work is about muscle and nutrition in older adults. Her studies show that sarcopenia (loss of muscle mass and strength), malnutrition and frailty are common, often occur together in hospitalised older people, and predict death after discharge. Through the RESORT cohort of more than 1,800 geriatric rehabilitation patients in Melbourne, and pooled data from over 270,000 people across Asia, she has worked on how these conditions should be measured.
  - Her recent papers build the case for Healthy Longevity Medicine and precision geromedicine, which aim to measure biological age and slow it with lifestyle, supplements and repurposed drugs. This includes meta-analyses linking DNA methylation clocks to physical activity and other exposures, a step-count clock, trials and reviews of NAD boosters and urolithin A, and surveys of what the public knows about healthspan. These summaries are drawn from her published work, not her personal views.
