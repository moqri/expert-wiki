  statement: The worm version of CBP/p300 is needed for the mitochondrial stress response, lower amyloid-beta aggregation and lifespan extension. In mice and people, higher CBP/p300 levels go with this stress response and with longevity.
  paper: pmid-33718883
  evidence: C. elegans genetics with mouse and human population data and mammalian cell experiments
  tags: [Muscle and mitochondria, Genetics of longevity]

