  statement: A common 10-letter DNA insertion in the COX7A2L gene raises its level in muscle, increasing mitochondrial supercomplexes and respiration. Higher COX7A2L goes with lower body fat and better cardiorespiratory fitness in people, and restoring it in mice raised maximal oxygen use.
