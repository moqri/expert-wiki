- rank: 1
  figure: "50,000+"
  figure_label: people whose blood proteins were used to build organ-specific aging clocks
  statement: Blood protein levels can estimate how fast each organ system is aging. Faster aging of an organ predicts disease in that organ, men age faster than women in most organs, and diet, lifestyle, job and medicines change organ aging rates.
  paper: pmid-39488213
  evidence: Plasma proteome models in over 50,000 UK Biobank and other cohort participants
  tags: [Biomarkers of aging, Organ aging]

- rank: 2
  figure: Diseases
  figure_label: of aging are accelerated aging of specific organs
  statement: Age-related chronic diseases look like speeded-up aging of the affected organ or body system. This supports both whole-body and personalized organ-specific anti-aging treatments.
  paper: pmid-39488213
  evidence: Organ-specific aging and mortality models trained on plasma proteomics in over 50,000 people
  tags: [Organ aging, Biomarkers of aging]

- rank: 3
  figure: "R = 0.12"
  figure_label: correlation between how well a clock predicts age and how well it predicts death
  statement: A clock that predicts calendar age well is not necessarily good at predicting death. Across 39 aging biomarkers, the Horvath skin and blood clock was best at predicting age (R² = 0.88), while GrimAge2 best predicted death (hazard ratio 2.57) and healthspan (hazard ratio 2.00).
  paper: pmid-41188602
  evidence: Biolearn open-source framework testing 39 biomarkers in over 20,000 people from diverse cohorts
  tags: [Biomarkers of aging]

- rank: 4
  figure: 11-22%
  figure_label: fewer loss-of-function mutations in centenarians
  statement: Centenarians carry 11 to 22% fewer rare gene-breaking mutations than controls, and their children show a similar pattern. RGP1, PCNX2 and ANO9 emerged as longevity genes with consistent effects on aging-related traits.
  paper: pmid-39424787
  evidence: Whole-exome sequencing of Ashkenazi Jewish centenarians, offspring and controls, with UK Biobank validation
  tags: [Genetics of longevity]

- rank: 5
  figure: 6 of 6
  figure_label: protein clocks showed lower biological age with treatment
  statement: In a 12-week phase 2a trial of the anti-fibrotic drug rentosertib for idiopathic pulmonary fibrosis, all six protein-based aging clocks predicted lower biological age in treated patients. Clocks alone could not separate anti-aging from anti-disease effects, so pathway analyses were used alongside them.
  paper: pmid-42706338
  evidence: Six proteomic clocks applied to serum proteomes from a randomized phase 2a trial
  tags: [Biomarkers of aging]

- rank: 6
  figure: Younger
  figure_label: biological age of old mouse cells after chemical reprogramming
  statement: A chemical cocktail lowered the biological age of fibroblasts from young and old mice by both gene expression and DNA methylation clocks. The strongest change was a boost in mitochondrial energy production, along with fewer aging-related metabolites.
  paper: pmid-38517750
  evidence: Epigenome, transcriptome, proteome, phosphoproteome and metabolome profiling of mouse fibroblasts
  tags: [Rejuvenation, Muscle and mitochondria]

- rank: 7
  figure: Toxic
  figure_label: fat build-up when the reprogramming cocktail was given to mice
  statement: In living middle-aged mice, low doses of the chemical reprogramming cocktail were safe but did not lower the biological age of kidney or liver. Higher doses caused severe weight loss and lipid droplet build-up in liver and kidney, a warning for this approach.
  paper: pmid-41589348
  evidence: In vivo dosing in genetically diverse UM-HET3 male mice plus cell studies
  tags: [Rejuvenation]

- rank: 8
  figure: Both ways
  figure_label: ovarian aging shifts with the age of the host
  statement: Old mouse ovaries became molecularly younger in young hosts and young ovaries became older in old hosts. Ovaries from 13-month-old donors supported live births at 17 to 18 months in young hosts but not in old ones, and young ovaries lowered the molecular age of aged liver and brain.
  paper: pmid-42999131
  evidence: Preprint; heterochronic ovary transplantation and parabiosis in mice with new ovarian clock (OvaAge)
  tags: [Organ aging, Rejuvenation]

- rank: 9
  figure: Immune genes
  figure_label: top the list of aging genes seen in both DNA methylation and gene activity
  statement: Genes whose methylation and expression both change with age in blood are enriched for adaptive immune functions. They replicate better across populations and track aging outcomes more strongly than genes found by either data type alone.
  paper: pmid-41554691
  evidence: Integrative multi-omic analysis of human blood across diverse cohorts
  tags: [Biomarkers of aging, Genetics of longevity]

- rank: 10
  figure: 6
  figure_label: key barriers to using aging biomarkers in the clinic
  statement: A survey of experts found six main barriers to bringing biomarkers of aging into clinical use. Recommendations include tying them to clinical decisions, making them affordable and widely available, and validating them in individuals.
  paper: pmid-39285015
  evidence: Expert survey and consensus recommendations
  tags: [Biomarkers of aging]

- rank: 11
  figure: Ceramides
  figure_label: build up in aging muscle in worms, mice and humans
  statement: Ceramide fats accumulate in skeletal muscle with age. Blocking their production with the drug myriocin restored mitochondrial and protein health, extended lifespan in worms, and improved muscle health and fitness in old mice.
  paper: pmid-37196064
  evidence: Lipidomics and interventions in C. elegans, mice and human muscle cells, plus human muscle transcriptomes
  tags: [Muscle and mitochondria]

