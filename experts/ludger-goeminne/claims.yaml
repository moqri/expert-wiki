  figure_label: protects against age-related inflammation
  statement: Blood GDF15, a signal released by stressed mitochondria, rises in older people. Mice lacking GDF15 had more tissue inflammation, liver injury and liver fat at old age, and genetically lower GDF15 in humans was linked to higher body weight and inflammation.
