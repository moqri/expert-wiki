  figure: CERS1
  figure_label: decline with age weakens muscle
  statement: The enzyme CERS1 falls with age in human muscle. Blocking it in old mice worsened muscle mass and function, and human gene variants that lower CERS1 were linked to weaker grip strength and poorer health in the UK Biobank.
  paper: pmid-38506902
  evidence: Human muscle data, aged mice, C. elegans, and Mendelian randomization in the UK Biobank
  tags: [Muscle and mitochondria, Genetics of longevity]

