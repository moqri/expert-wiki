  statement: Of seven mouse strains fed a liver-disease diet, only PWK/PhJ developed NASH with extensive fibrosis, while CAST/EiJ was fully resistant. Low liver mitochondrial function marked the susceptible strain, whose gene profile best matched human NASH.
