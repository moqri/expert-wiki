headline: Builds tools to measure biological aging, including aging clocks that separate harmful changes from protective ones, and uses them with AI to find what slows or reverses aging.
summary:
  - Kejun Ying's published work asks what aging clocks actually measure and how to make them more useful. Ying used human genetics (Mendelian randomization) to find DNA methylation sites that plausibly cause changes in aging-related traits, and found that existing clocks are not enriched for them. From these sites Ying built DamAge, which tracks harmful changes and predicts mortality, and AdaptAge, which tracks protective adaptations. Related work shows that much of epigenetic aging is stochastic drift, that about 90% of the methylation gained with age falls in Polycomb (PRC2) target regions, and that a single biological age can be split into the separate ages of thousands of cellular pathways (Ageome).
  - A second line of work is about testing biomarkers of aging fairly. Ying led Biolearn, an open framework that compared 39 biomarkers in more than 20,000 people and found that a clock's accuracy at predicting age says almost nothing about how well it predicts death. Ying also helped compare 14 epigenetic clocks against 174 diseases, contributed to recommendations on how biomarkers of aging should be validated, and co-organized an open competition for new biomarkers. The same tools are applied beyond methylation, to blood proteins that estimate the age of individual organs in over 50,000 people, to transcriptomes across four mammals, and to a large DNA methylation foundation model (MethylGPT).
  - Ying's work increasingly uses AI agents and large public datasets. ClockBase Agent reanalyzed 43,602 intervention-versus-control comparisons with more than 40 aging clocks and flagged over 500 interventions that lower biological age, one of which (ouabain) was then tested in aged mice. Other studies use these clocks to show that biological age can move in both directions, for example when old fat tissue or old ovaries are transplanted into young mice, and link genetics to longevity, including a lower burden of damaging gene variants in centenarians. These summaries are drawn from Ying's published work, not Ying's personal views.
