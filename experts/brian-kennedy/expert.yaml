headline: Nutrient-sensing pathways in aging, from yeast genetics to mouse and human interventions targeting mTOR and metabolism.
summary:
  - "Kennedy's early work used budding yeast to find the genes that control how long a cell lives. In work at MIT, Kennedy's team showed that a mutation in the silencing gene SIR4 extended yeast life span by more than 30%. Later screens of thousands of single-gene deletion strains, culminating in a test of 4,698 strains, showed that cutting the nutrient-sensing TOR and Sch9 pathways, or making fewer 60S ribosome subunits, lengthens life span much as calorie restriction does, and that many of these longevity genes are shared with worms. The same work found that calorie restriction extends yeast life span largely without the sirtuin Sir2, and that resveratrol does not activate Sir2 in living yeast."
  - "Kennedy's group carried these findings into mice. Rapamycin, which blocks mTOR, reversed age-related heart dysfunction when given to 24-month-old mice for 3 months, and it rescued heart and muscle function and extended survival in mice lacking the nuclear protein lamin A/C, a model of muscular dystrophy and progeria-like disease. Because rapamycin has side effects through a second complex, mTORC2, the group described an analog, DL001, that is 40 times more selective for mTORC1. In mice, the natural metabolite alpha-ketoglutarate given as a calcium salt extended life, reduced frailty and lowered inflammation."
  - "With collaborators, Kennedy helped define geroscience, the idea that slowing aging itself could delay many chronic diseases at once, and contributed to studies showing that removing senescent cells reduces the side effects of chemotherapy and that taurine declines with age and its supplementation improves health in mice and monkeys. At the National University of Singapore, the work has turned to measuring and slowing aging in people: clinical aging clocks such as PCAge and LinAge that predict mortality and point to treatable targets, consensus frameworks for validating biomarkers of aging, and a placebo-controlled trial of alpha-ketoglutarate in middle-aged adults. Most of the intervention findings come from yeast, worms and mice and have not yet been confirmed in large human trials."
highlights:
  - "**Yeast aging genetics.** Showed that reduced TOR and Sch9 signaling extends yeast replicative life span in response to nutrients ([*Science* 2005](paper:pmid-16293764)), and identified conserved longevity genes in an analysis of 4,698 deletion strains ([*Cell Metabolism* 2015](paper:pmid-26456335))."
  - "**Rapamycin and mTORC1.** Showed that late-life rapamycin reverses age-related cardiac dysfunction in mice ([*Aging Cell* 2013](paper:pmid-23734717)) and rescues cardiac and skeletal muscle function and extends survival in lamin A/C-deficient mice ([*Sci Transl Med* 2012](paper:pmid-22837538))."
  - "**Alpha-ketoglutarate.** Reported that alpha-ketoglutarate extends lifespan and compresses morbidity in aging mice ([*Cell Metabolism* 2020](paper:pmid-32877690)) and designed a placebo-controlled trial in middle-aged adults ([*GeroScience* 2023](paper:pmid-37217632))."
  - "**Geroscience and aging biomarkers.** Co-authored the geroscience framework linking aging to chronic disease ([*Cell* 2014](paper:pmid-25417146)) and developed principal component-based clinical aging clocks that predict mortality ([*Nature Aging* 2024](paper:pmid-38898237))."
