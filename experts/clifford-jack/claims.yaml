  figure_label: plasma p-tau181 for intermediate/high Alzheimer's pathology in impaired people
  statement: In 1,136 people with same-day amyloid PET, tau PET and blood draw, plasma biomarkers with risk factors predicted PET stages with acceptable to excellent accuracy. Plasma p-tau181 alone identified intermediate or high Alzheimer's pathology with C = 0.87 in unimpaired and 0.90 in impaired people.
  paper: pmid-36789483
