  figure_label: higher rate of new neurodegeneration at 85 than at 65
  statement: In 4,049 people without dementia, rates of moving to a more abnormal biomarker state rose steeply with age. At 85 compared with 65, the move from normal to neurodegeneration alone was 11 times as frequent (17.2 vs 1.6 per 100 person-years), while new amyloid plateaued after about 75.
  paper: pmid-26597325
  evidence: Population-based longitudinal cohort, 4,049 participants, multistate Markov model
  tags: [Population studies, Risk and prognosis]
- rank: 17
  figure: "74% vs 62%"
  figure_label: lifetime dementia risk at 65 for women vs men with APOE4 and high amyloid
  statement: In 4,984 people without dementia followed a median of 9.4 years, high amyloid doubled the hazard of dementia (HR 2.11). Among APOE4 carriers with high amyloid, remaining lifetime dementia risk from age 65 was 74% for women and 62% for men.
  paper: pmid-35310829
  evidence: Population-based cohort, 4,984 participants, multistate models with competing mortality
  tags: [Risk and prognosis, Amyloid and tau PET]
- rank: 18
  figure: "R² 0.26 → 0.31"
  figure_label: added by amyloid, tau and MRI to predicting memory decline
  statement: In 480 older people without dementia followed for about 4.8 years, memory declined fastest when amyloid was abnormal together with tau or neurodegeneration. Adding the three scans to age, sex, education, health conditions and APOE improved prediction only modestly, from R² 0.26 to 0.31.
  paper: pmid-31211344
  evidence: Population-based cohort, 480 participants with amyloid PET, tau PET and MRI
  tags: [Risk and prognosis, Amyloid and tau PET]
- rank: 19
