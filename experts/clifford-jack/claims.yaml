- rank: 1
  figure: "Biological AD"
  figure_label: Alzheimer's defined by brain changes, not symptoms
  statement: The 2018 NIA-AA research framework defines Alzheimer's disease in living people by its underlying brain changes, measured with biomarkers of amyloid, tau and neurodegeneration (AT(N)), rather than by symptoms. Cognitive stage is described separately.
  paper: pmid-29653606
  evidence: Consensus research framework of the NIA-AA workgroup
  tags: [Defining Alzheimer's]
- rank: 2
  figure: "Core 1"
  figure_label: one abnormal amyloid PET, CSF or accurate blood test is enough for diagnosis
  statement: The 2024 Alzheimer's Association criteria say Alzheimer's disease begins with brain changes while people have no symptoms. An abnormal early "Core 1" biomarker, such as amyloid PET, an approved spinal fluid test or an accurate blood test (especially p-tau217), is enough to diagnose it.
  paper: pmid-38934362
  evidence: Revised diagnostic and staging criteria of the Alzheimer's Association workgroup
  tags: [Defining Alzheimer's, Blood tests]
- rank: 3
  figure: "Amyloid first"
  figure_label: then neurodegeneration, which tracks symptoms
  statement: A model of Alzheimer's biomarkers proposed that amyloid markers (low CSF amyloid-beta 42, raised amyloid PET) become abnormal first while people are still cognitively normal, and markers of neuronal injury (CSF tau, MRI atrophy, low FDG-PET) become abnormal later and track how severe symptoms are.
  paper: pmid-20083042
  evidence: Hypothetical model built from published biomarker evidence
  tags: [Disease model]
- rank: 4
  figure: "A/T/N"
  figure_label: amyloid, tau and neurodegeneration, each rated positive or negative
  statement: The A/T/N scheme sorts 7 major Alzheimer's biomarkers into 3 groups, amyloid (A), tau (T) and neurodegeneration (N), each rated normal or abnormal, giving profiles such as A+/T+/N-. It describes what is in the brain without assuming an order of events or a diagnosis.
  paper: pmid-27371494
  evidence: Proposed classification scheme
  tags: [Defining Alzheimer's]
- rank: 5
  figure: "~15 years"
  figure_label: for brain amyloid to rise from moderate to high
  statement: In 260 people with repeated amyloid PET scans, amyloid built up slowly at low levels, fastest at mid levels, and then levelled off. Moving from an SUVR of 1.5 to 2.5 took about 15 years, a long window for prevention treatment.
  paper: pmid-23446680
  evidence: Serial amyloid PET in 260 adults aged 70-92 (Mayo Clinic Study of Aging and ADRC)
  tags: [Disease model, Amyloid and tau PET]
- rank: 6
  figure: "Updated model"
  figure_label: amyloid may speed up tau that started earlier
  statement: The 2013 update to the biomarker model indexed people by time rather than symptom severity, allowed for differences between people in how much decline the same pathology causes, and proposed that amyloid and tau may start independently, with amyloid accelerating tau already present in limbic and brainstem areas.
  paper: pmid-23332364
  evidence: Updated hypothetical model reviewing evidence since 2010
  tags: [Disease model]
- rank: 7
  figure: "84% vs 69%"
  figure_label: lifetime risk of MCI at centiloid 100 vs 5 (women with APOE4, from age 75)
  statement: In 5,158 cognitively unimpaired adults, lifetime risk of mild cognitive impairment and dementia rose steadily with amyloid PET level. For women carrying APOE4 starting at age 75, lifetime risk of MCI was 69% at centiloid 5 and 84% at centiloid 100; for men carrying APOE4 it was 56% and 77%.
  paper: pmid-41240917
  evidence: Population-based cohort, 5,158 cognitively unimpaired and 700 MCI participants, multistate modelling
  tags: [Risk and prognosis, Amyloid and tau PET]
- rank: 8
  figure: ">90%"
  figure_label: of people aged 85 have at least one abnormal brain biomarker
  statement: In cognitively unimpaired people aged 50 to 95, having all-normal amyloid, tau and neurodegeneration markers was most common until the late 70s, after about 80 having all three abnormal was most common, and by 85 more than 90% of men and women had at least one abnormality.
  paper: pmid-28456479
  evidence: Cross-sectional population study, 435 with amyloid PET, tau PET and MRI plus 1,113 with amyloid PET and MRI
  tags: [Population studies, Amyloid and tau PET]
- rank: 9
  figure: "85%"
  figure_label: of Alzheimer's patients below the healthy range of hippocampal volume
  statement: An MRI method for measuring the hippocampus separated 20 people with Alzheimer's dementia from 22 healthy older controls, with 85% of patients falling below the range of the controls, across the whole age range studied.
  paper: pmid-1734300
  evidence: Case-control MRI volumetry, 20 patients and 22 controls
  tags: [Brain MRI]
- rank: 10
  figure: "27 of 80"
  figure_label: people with MCI developed Alzheimer's; smaller hippocampus predicted who
  statement: In 80 people with mild cognitive impairment followed for about 33 months, 27 developed dementia. A smaller hippocampus on MRI at the start predicted conversion to Alzheimer's, even after accounting for age, memory tests, APOE genotype and heart risk factors.
  paper: pmid-10227624
  evidence: Prospective cohort, 80 patients with MCI
  tags: [Brain MRI, Risk and prognosis]
- rank: 11
  figure: "3.7% vs 1.7%"
  figure_label: yearly hippocampal loss in MCI decliners vs stable controls
  statement: In 129 older adults scanned twice about 3 years apart, the hippocampus shrank faster in people whose memory got worse. Yearly loss was 1.7% in stable controls, 2.8% in controls who declined, 2.6% in stable MCI, 3.7% in MCI who declined, and 3.5% in Alzheimer's.
  paper: pmid-10953178
  evidence: Longitudinal MRI cohort, 129 participants
  tags: [Brain MRI]
- rank: 12
  figure: "Atrophy, not amyloid"
  figure_label: tracks memory decline over a year
  statement: In 61 people with repeat amyloid PET and MRI one year apart, amyloid rose slowly at the same rate whatever their clinical stage and did not track cognitive change, while brain shrinkage was faster with worse stage and tracked worsening on memory and function scores.
  paper: pmid-19339253
  evidence: Serial PIB PET and MRI, 21 normal, 32 MCI and 8 Alzheimer's
  tags: [Disease model, Brain MRI, Amyloid and tau PET]
- rank: 13
  figure: "89%"
  figure_label: of people with Alzheimer's dementia had both high amyloid and high tau
  statement: Among 1,343 people with amyloid and tau PET, abnormal tau rarely appeared without abnormal amyloid, but abnormal amyloid without tau was common. High amyloid was compatible with normal thinking, but highly abnormal tau was not, and 89% of people with Alzheimer's clinical syndrome were high on both.
  paper: pmid-31501889
  evidence: Amyloid and tau PET in 1,343 participants across 5 clinical groups
  tags: [Amyloid and tau PET, Disease model]
- rank: 14
  figure: "Centiloid 19"
  figure_label: cut point for an abnormal amyloid PET scan
  statement: Comparing five ways of setting cut points, the group chose an amyloid PET threshold of SUVR 1.42 (centiloid 19) based on reliable worsening over time, and set lenient and conservative cut points for tau PET, FDG-PET and MRI cortical thickness.
  paper: pmid-27697430
  evidence: Methods comparison in Mayo Clinic imaging cohorts
  tags: [Amyloid and tau PET, Brain MRI]
- rank: 15
  figure: "42%"
  figure_label: of cognitively normal 89-year-olds had both amyloid and neurodegeneration
  statement: In 985 cognitively normal people aged 50 to 89, all had normal amyloid and neurodegeneration markers at 50, but only 17% did by 89, when 42% had both abnormal. Amyloid without neurodegeneration peaked at 28% around age 74 and was more frequent in APOE4 carriers.
  paper: pmid-25201514
  evidence: Cross-sectional population study, 985 participants
  tags: [Population studies]
- rank: 16
