  statement: In 1,246 cognitively normal people aged 30 to 95, amyloid stayed low until about 70 and then rose. APOE4 did not change memory or hippocampal size, but 10% of carriers had positive amyloid scans by 57 versus 64 for non-carriers. Men had worse memory and smaller hippocampi than women.
