  figure_label: p-tau217 and amyloid PET predict average memory decline
  statement: In 645 cognitively unimpaired people, plasma p-tau217 and amyloid PET, along with age, were the key independent predictors of memory decline. They predicted average decline in groups well, but prediction for any single person was wide.
  paper: pmid-38265198
  evidence: Population-based cohort, 645 participants
  tags: [Blood tests, Risk and prognosis]
