  figure: "AUC 0.81-0.86"
  figure_label: for plasma p-tau to flag abnormal amyloid PET in the community
  statement: In 1,329 community members aged 30 to 98, plasma p-tau181 and p-tau217 predicted abnormal amyloid PET (AUC 0.81 to 0.86). Chronic kidney disease raised p-tau about as much as brain amyloid did, so other illnesses must be considered when reading the tests.
  paper: pmid-35618838
