  statement: In 1,437 people without dementia, diabetes that began in midlife was linked to a 4% smaller hippocampus, 2.9% smaller brain, more small strokes and about double the odds of mild cognitive impairment. Midlife high blood pressure was linked to strokes and white matter damage.
