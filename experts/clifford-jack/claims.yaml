  statement: In 1,995 older adults without dementia, more education, work complexity and mid- to late-life mental activity went with better thinking. For APOE4 carriers, high lifetime intellectual enrichment was linked to cognitive impairment starting about 8.7 years later than low enrichment.
  paper: pmid-25054282
  evidence: Population-based cohort, 1,995 participants
  tags: [Lifestyle and health]
