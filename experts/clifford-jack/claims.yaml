  statement: Suspected non-Alzheimer pathophysiology (SNAP), brain injury markers without amyloid, is found in about 23% of clinically normal people over 65 and 25% of people with mild impairment. It is less linked to APOE4, and people with it do worse than those with all-normal markers.
  paper: pmid-26782335
  evidence: Perspective reviewing published cohort data
  tags: [Defining Alzheimer's, Population studies]
