name: Henrik Zetterberg
credentials: MD, PhD
affiliation: University of Gothenburg and UCL Dementia Research Institute
department: Department of Psychiatry and Neurochemistry, Sahlgrenska Academy
areas: [Alzheimer's]
headline: Development and validation of fluid biomarkers for Alzheimer's disease and other forms of neurodegeneration.
summary:
  - Henrik Zetterberg's work turns the proteins that leak from a diseased brain into tests that doctors can use. Early studies in spinal fluid showed that low amyloid (Aβ42) together with high tau marks Alzheimer's disease in people with mild memory problems, and that amyloid levels are already fully changed 5 to 10 years before dementia. Roughly 90% of people with mild cognitive impairment and an abnormal spinal fluid pattern developed Alzheimer's dementia within 9 to 10 years. Using the ratio of two amyloid forms (Aβ42/Aβ40) instead of Aβ42 alone made the test more accurate.
  - Zetterberg's group then helped move these tests from spinal fluid into blood. Ultrasensitive assays for phosphorylated tau in blood (p-tau181, p-tau217 and p-tau231) separate Alzheimer's from other dementias with accuracies of about 90% or higher, rise in the earliest stage when amyloid is only starting to build up, and in one study predicted Alzheimer's found at autopsy 8 years before death. A commercial p-tau217 blood test matched spinal fluid tests, and a fully automated version reached 85% to 91% accuracy in primary and secondary care.
  - A second theme is neurofilament light (NfL), a protein released when nerve fibres are damaged. Zetterberg's papers show that NfL in blood tracks brain damage across many conditions, including Alzheimer's, multiple sclerosis, Huntington's disease, atypical parkinsonism, sports concussion and severe COVID-19. NfL is not specific to one disease, but it shows how active the damage is and who is likely to decline faster.
  - The group also studies the brain's support cells. A blood marker of reactive astrocytes, GFAP, rises early in people with amyloid build-up but normal memory, and spinal fluid markers of inflammation and blood vessel changes track brain thinning and later decline. Most of this work comes from large shared cohorts such as BioFINDER and ADNI, and from head-to-head comparisons of the many blood tests now on the market.
highlights:
  - "**Cerebrospinal fluid biomarkers.** In patients with mild cognitive impairment, a CSF profile of low Aβ42 and elevated tau was [strongly associated with incipient Alzheimer's disease](paper:pmid-16488378) over 4 to 6 years of follow-up."
  - "**Plasma phosphorylated tau.** Co-developed and validated an ultrasensitive [blood p-tau181 assay](paper:pmid-32333900) and evaluated [plasma p-tau217](paper:pmid-32722745), which distinguished Alzheimer's disease from other neurodegenerative disorders with high accuracy."
  - "**Neurofilament light.** Showed that blood neurofilament light reflects neuroaxonal damage, including [neurodegeneration in Alzheimer's disease](paper:pmid-28346578) and [neuronal damage in multiple sclerosis](paper:pmid-28512753)."
  - "**Astrocytic markers.** Found that [plasma GFAP is an early marker of amyloid-β](paper:pmid-34259835) but not tau pathology, elevated already in cognitively unimpaired amyloid-positive individuals."
