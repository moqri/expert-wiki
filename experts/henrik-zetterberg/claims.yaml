  figure: "85% to 91%"
  figure_label: accuracy of a fully automated p-tau217 blood test in clinics
  statement: A commercial, fully automated plasma p-tau217 test detected Alzheimer's pathology with 89% to 91% accuracy in memory clinics and 85% in primary care. Using two cutoffs raised accuracy to 92% to 94%, with 12% to 17% of people left in an uncertain middle range. Accuracy was lower in people aged 80 or older but was not affected by kidney disease, diabetes, sex or APOE genotype.
  paper: pmid-40205199
  evidence: Multicohort diagnostic study, 1,767 people with cognitive symptoms in Sweden, Spain and Italy, including primary care
  tags: [Blood tests]
