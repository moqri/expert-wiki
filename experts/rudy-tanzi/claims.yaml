- rank: 1
  figure: Chromosome 21
  figure_label: carries the gene for the amyloid precursor protein, near the inherited Alzheimer's locus
  statement: A cloned DNA copy showed that amyloid-β, the main protein in Alzheimer's plaques, is cut from a larger protein made in many tissues. Its gene sits on chromosome 21, close to the inherited Alzheimer's defect, which explains why it is overexpressed in the brains of fetuses with Down syndrome (three copies of chromosome 21).
  paper: pmid-2949367
  evidence: Gene cloning, mRNA mapping and genetic linkage in families
  tags: [Alzheimer's genes]
