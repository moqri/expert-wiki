  figure: 8 microbes
  figure_label: killed by amyloid-β as potently as a known human antimicrobial peptide
  statement: Amyloid-β killed eight common, clinically relevant microorganisms with potency equal to, and sometimes greater than, the classic human antimicrobial peptide LL-37. Alzheimer's brain tissue had more antimicrobial activity than age-matched normal brain, and removing amyloid-β with antibodies abolished the difference.
